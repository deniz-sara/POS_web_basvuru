<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Belirle - QNBpay Yönetim Paneli</title>
    <style>
        :root {
            --primary: #002d72;
            --secondary: #e66425;
            --bg: #f4f6f9;
            --surface: #ffffff;
            --text: #333333;
            --border: #e2e8f0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 10px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card img {
            height: 40px;
            margin-bottom: 20px;
        }

        .login-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: #4a5568;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 45, 114, 0.1);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #001f4d;
        }

        .error-message {
            color: #e53e3e;
            background: #fff5f5;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #feb2b2;
        }
        .success-message {
            color: #2f855a;
            background: #f0fff4;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #9ae6b4;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="../qnbpay-logo.webp" alt="QNBpay Logo">
        <h2>Şifre Belirle</h2>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="passwordForm" onsubmit="setPassword(event)">
            <div class="form-group">
                <label for="password">Yeni Şifre</label>
                <input type="password" id="password" required placeholder="En az 6 karakter">
            </div>
            <div class="form-group">
                <label for="password_confirm">Yeni Şifre (Tekrar)</label>
                <input type="password" id="password_confirm" required placeholder="Şifrenizi tekrar girin">
            </div>
            <button type="submit" class="btn" id="submitBtn">Şifreyi Kaydet</button>
        </form>
    </div>

    <script>
        // Token'ı URL'den al
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('passwordForm').style.display = 'none';
            showError('Geçersiz bağlantı. Lütfen e-postanızdaki linke tekrar tıklayın.');
        }

        function showError(msg) {
            const errEl = document.getElementById('errorMessage');
            errEl.innerText = msg;
            errEl.style.display = 'block';
        }
        function showSuccess(msg) {
            const el = document.getElementById('successMessage');
            el.innerText = msg;
            el.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('passwordForm').style.display = 'none';
        }

        async function setPassword(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const passConfirm = document.getElementById('password_confirm').value;
            const btn = document.getElementById('submitBtn');

            if (pass !== passConfirm) {
                showError('Şifreler eşleşmiyor.');
                return;
            }

            if (pass.length < 6) {
                showError('Şifre en az 6 karakter olmalıdır.');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = 'İşleniyor...';
                
                const res = await fetch('/api/admin/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: pass })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showSuccess('Şifreniz başarıyla oluşturuldu. Giriş sayfasına yönlendiriliyorsunuz...');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    showError(data.message || 'Bir hata oluştu.');
                    btn.disabled = false;
                    btn.innerText = 'Şifreyi Kaydet';
                }
            } catch (err) {
                showError('Sunucuya bağlanılamadı.');
                btn.disabled = false;
                btn.innerText = 'Şifreyi Kaydet';
            }
        }
    </script>
</body>
</html>
